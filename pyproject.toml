[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmd-import-spec"
version = "0.1.0"
description = "Reference resolver and conformance vectors for @path imports in AGENTS.md files."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "agentmd-import-spec contributors" }]
keywords = ["agents.md", "imports", "conformance", "specification", "resolver"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Software Development :: Documentation",
]
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-PyYAML>=6.0"]

[project.scripts]
agentmd-import = "agentmd_import.cli:main"

[project.urls]
Homepage = "https://github.com/maxico714/agentmd-import-spec"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentmd_import = ["profiles/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["vectors"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
